<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COMPRAFACIL Scraper</title>
<style>
[hidden]{display:none !important}
body{width:420px;margin:0;padding:18px;box-sizing:border-box;font-family:Arial,sans-serif;background:#f7f8fa;color:#111827}
h1{font-size:18px;margin:0 0 4px}
.app-title{display:flex;align-items:center;gap:8px}
.site-icon{width:22px;height:22px;flex:0 0 auto}
.sites-list .site-icon{width:16px;height:16px;vertical-align:-3px;margin-right:5px}
.subtitle{font-size:12px;color:#6b7280;margin-bottom:14px}
button{width:100%;border:0;border-radius:8px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;background:#ff9900;color:#111}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:not-allowed}
button.secondary{background:#232f3e;color:#fff;padding:10px}
button.ghost{background:#e5e7eb;color:#111;padding:10px;width:auto;flex:0 0 auto}
.check{display:flex;gap:8px;align-items:flex-start;font-size:12px;margin-bottom:8px;cursor:pointer;line-height:1.35}
.check input{margin:1px 0 0}
#status{margin-top:12px;padding:11px;background:#fff;border-radius:7px;font-size:12px;line-height:1.55;white-space:pre-line}
.success{color:#15803d}
.error{color:#b91c1c}
.banner{background:#fff7e6;border:1px solid #fcd34d;border-radius:7px;padding:9px 11px;font-size:12px;line-height:1.45;margin-bottom:12px}
.banner a{color:#b45309;font-weight:700}
.banner p{margin:0}
.banner p+p{margin-top:6px}
#collection{margin-top:12px;padding:11px;background:#fff;border-radius:7px}
.count{font-size:13px;margin-bottom:9px}
.row{display:flex;gap:8px}
.sources{list-style:none;margin:0 0 10px;padding:0;max-height:260px;overflow-y:auto;border-top:1px solid #f0f1f3}
.sources li{font-size:12px;padding:6px 0;border-bottom:1px solid #f0f1f3;line-height:1.4}
.sources a{color:#b45309;font-weight:700;text-decoration:none}
.sources a:hover{text-decoration:underline}
.sites-title{margin:0 0 8px;font-size:13px;font-weight:700}
.sites-list{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.sites-list a{display:inline-block;padding:6px 10px;border:1px solid #fcd34d;border-radius:7px;background:#fff7e6;color:#b45309;font-size:12px;font-weight:700;text-decoration:none}
.sites-list a:hover{background:#ffedc2}
.jobs{margin-top:12px;border:1px solid #fcd34d;background:#fff7e6}
.job-title{margin:0 0 4px;font-size:13px;font-weight:700}
.jobs .hint{margin:0 0 8px;word-break:normal;white-space:pre-line}
.job-confirm{margin:0 0 10px;padding:10px;background:#fff;border:1px solid #fca5a5;border-radius:7px}
.job-confirm p{margin:0 0 8px;font-size:12px;line-height:1.45;white-space:pre-line}
.job-confirm button{padding:9px;font-size:13px}
.queue-title{margin:10px 0 4px;font-size:12px;font-weight:700}
.queue{list-style:none;margin:0;padding:0}
.queue li{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;padding:4px 0;border-top:1px solid #f3e3b5}
button.mini{width:auto;padding:2px 8px;font-size:11px;font-weight:700;background:#e5e7eb;color:#111;border-radius:6px}
button.mini.danger{background:#b91c1c;color:#fff}
.sources .group-toggle,.sources .group-delete{width:auto;padding:0 4px;background:none;font-size:12px;font-weight:400;color:#6b7280;border-radius:4px}
.sources .group-delete{float:right;opacity:.7;font-size:14px}
.sources .group-delete:hover{opacity:1}
.sources .group-details{margin:4px 0 2px 18px;padding:6px 8px;background:#f9fafb;border-radius:6px;color:#374151;white-space:pre-line;font-size:11px;line-height:1.5}
.sources .confirm-text{color:#b91c1c}
.sources .see-group{padding:2px 0 0;font-size:11px}
.region-text{margin:0 0 10px;font-size:12px;line-height:1.45;color:#374151;word-break:break-word}
.sources .meta{color:#6b7280}
.group-options{margin:4px 0 2px}
.group-options .check{margin:0 0 6px}
.group-options .meta{color:#6b7280}
.group-options .hint{margin-top:0;word-break:normal}
.sources .tags{margin:3px 0 0 18px;display:flex;gap:4px;flex-wrap:wrap}
.sources .tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;background:#f3f4f6;color:#6b7280}
.sources .tag.on{background:#dcfce7;color:#15803d}
.sources .group-name{color:#b45309;font-weight:700;cursor:text;user-select:none}
.sources .open-page{font-weight:400}
.sources .rename{padding:5px 8px;font-size:12px}
.sources .hint{margin:4px 0 0}
.panel{background:#fff;border-radius:7px;padding:12px}
.field-label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
.text-input{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #d1d5db;border-radius:7px;font-size:13px}
.text-input:focus{outline:2px solid #ff9900;border-color:#ff9900}
.text-input:disabled{background:#f3f4f6;color:#9ca3af}
.hint{font-size:11px;color:#6b7280;margin:5px 0 10px;word-break:break-all}
.panel .check{margin:8px 0 10px}
#categoryHint{margin-bottom:0;white-space:pre-line;word-break:normal}
.hint.ok{color:#15803d}
.label-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mode-switch{display:flex;gap:4px;padding:3px;background:#f3f4f6;border-radius:8px;margin-bottom:8px}
.mode-switch .mode{flex:1;padding:6px 8px;font-size:12px;font-weight:700;background:transparent;color:#6b7280;border-radius:6px}
.mode-switch .mode.active{background:#fff;color:#111827;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.mode-switch .mode:disabled{opacity:.45}
.levels{display:flex;flex-direction:column;gap:6px}
.levels select{cursor:pointer;background:#fff}
.levels select:disabled{cursor:not-allowed}
.link-btn{width:auto;background:none;padding:0 0 6px;font-size:12px;font-weight:700;color:#b45309;border-radius:0}
.link-btn:hover{text-decoration:underline;opacity:1}
.combo-list{list-style:none;margin:4px 0 0;padding:4px 0;max-height:260px;overflow-y:auto;border:1px solid #d1d5db;border-radius:7px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.combo-list li{display:flex;gap:8px;align-items:baseline;justify-content:space-between;padding:7px 10px;font-size:12px;line-height:1.35;cursor:pointer}
.combo-list li.active{background:#fff3e0}
.combo-list li .path{color:#374151}
.combo-list li .path b{color:#111827}
.combo-list li .code{flex:0 0 auto;font-size:10px;color:#9ca3af;font-family:Consolas,monospace}
.combo-list li mark{background:#ffe0a3;color:inherit;border-radius:2px;padding:0}
.combo-list .group{font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.04em;padding:6px 10px 3px;cursor:default}
.combo-list .empty{color:#6b7280;cursor:default}
.hint.error{color:#b91c1c}
#exportForm{margin-top:10px}
#duplicatePanel{background:#fff7e6;border:1px solid #fcd34d;border-radius:7px;padding:12px;margin-bottom:10px}
#duplicatePanel p{margin:0 0 10px;font-size:12px;line-height:1.5;white-space:pre-line}
#duplicatePanel .title{font-weight:700;font-size:13px;margin-bottom:6px}
#replaceData{padding:10px;font-size:13px}
footer{margin-top:14px;font-size:11px;color:#6b7280;display:flex;justify-content:space-between}
footer a{color:#6b7280}
</style>
</head>
<body>
<h1 class="app-title"><img id="appIcon" class="site-icon" src="icons/icon32.png" alt=""><span id="appTitle">COMPRAFACIL Scraper</span></h1>
<div class="subtitle">Exportador a la plantilla de scraping · v<span id="version"></span></div>

<div id="update" class="banner" hidden></div>

<div id="sitesPanel" class="panel" hidden>
  <p class="sites-title">Abre una página de un sitio disponible:</p>
  <ul id="sitesList" class="sites-list"></ul>
</div>

<div id="regionPanel" class="panel" hidden>
  <p class="sites-title" id="regionTitle"></p>
  <p class="region-text" id="regionText"></p>
  <button id="regionOpen" class="secondary"></button>
</div>

<button id="scrape">Extraer productos</button>

<div id="jobsPanel" class="panel jobs" hidden>
  <div id="jobCurrent">
    <p class="job-title" id="jobTitle"></p>
    <div class="hint" id="jobProgress"></div>
    <div id="jobConfirm" class="job-confirm" hidden>
      <p id="jobConfirmText"></p>
      <div class="row">
        <button id="jobContinue" type="button">Seguir</button>
        <button id="jobHalt" class="secondary" type="button">Detener y guardar</button>
      </div>
    </div>
    <div class="row" id="jobButtons">
      <button id="jobGo" class="ghost" type="button">Ir a la pestaña</button>
      <button id="jobStop" class="secondary" type="button">Detener y guardar lo leído</button>
    </div>
  </div>
  <p class="queue-title" id="jobQueueTitle" hidden></p>
  <ul id="jobQueue" class="queue"></ul>
</div>

<div id="duplicatePanel" hidden>
  <p class="title">⚠ Esta página ya fue extraída</p>
  <p id="duplicateInfo"></p>
  <div class="row">
    <button id="replaceData">Reemplazar datos anteriores</button>
    <button id="cancelDuplicate" class="ghost">Cancelar</button>
  </div>
</div>

<form id="categoryForm" class="panel" novalidate hidden>
  <div class="label-row">
    <label class="field-label" for="category">Categoría de estos productos</label>
    <button type="button" id="refreshCats" class="link-btn" title="Volver a descargar la lista de categorías">↻ Actualizar</button>
  </div>
  <div class="mode-switch" role="tablist" aria-label="Forma de elegir la categoría">
    <button type="button" id="modeSearch" class="mode" role="tab">🔍 Buscar</button>
    <button type="button" id="modeBrowse" class="mode" role="tab">☰ Por niveles</button>
  </div>
  <div id="browseGroup" class="levels" hidden>
    <select id="level1" class="text-input" aria-label="Categoría principal"></select>
    <select id="level2" class="text-input" aria-label="Categoría secundaria"></select>
    <select id="level3" class="text-input" aria-label="Categoría terciaria"></select>
  </div>
  <div id="searchGroup" class="combo">
    <input id="category" class="text-input" autocomplete="off" spellcheck="false" required
           role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="categoryList"
           placeholder="Ej: Audífonos inalámbricos">
    <ul id="categoryList" class="combo-list" role="listbox" hidden></ul>
  </div>
  <div class="hint" id="categoryHint" hidden></div>
  <label class="check"><input type="checkbox" id="multiCategory"> No llenar categoría</label>
  <label class="field-label" for="groupName">Nombre del grupo</label>
  <input id="groupName" class="text-input" autocomplete="off" maxlength="60" placeholder="Ej: Audífonos HyperX">
  <div class="hint" id="groupHint"></div>
  <div class="group-options">
    <span class="field-label">Opciones del grupo (no se cambian después)</span>
    <label class="check"><input type="checkbox" id="optVariaciones"> Extraer variantes <span class="meta">(variacion = Sí)</span></label>
    <label class="check"><input type="checkbox" id="optGuiaTalla"> Guía de tallas <span class="meta">(guia_talla = Sí)</span></label>
    <div class="hint" id="optionsHint"></div>
  </div>
  <div id="limitGroup" hidden>
    <label class="field-label" for="loadLimit">Límite de la extracción</label>
    <div class="mode-switch" role="tablist" aria-label="Límite por páginas o por productos">
      <button type="button" id="limitPages" class="mode" role="tab">Páginas</button>
      <button type="button" id="limitProducts" class="mode" role="tab">Productos</button>
    </div>
    <input id="loadLimit" class="text-input" type="number" min="1" step="1" inputmode="numeric">
    <div class="hint" id="limitHint"></div>
  </div>
  <div id="fileNameGroup">
    <label class="field-label" for="fileName">Nombre del archivo Excel</label>
    <input id="fileName" class="text-input" autocomplete="off" placeholder="Ej: Audifonos_Hyperx">
    <div class="hint" id="fileNamePreview"></div>
  </div>
  <div class="row">
    <button type="submit">Extraer</button>
    <button type="button" id="cancelCategory" class="ghost">Cancelar</button>
  </div>
</form>

<div id="status" hidden></div>

<div id="collection" hidden>
  <div class="count"><strong id="count">0</strong> productos en la lista</div>
  <ul id="sources" class="sources" hidden></ul>
  <div class="row">
    <button id="download" class="secondary">Descargar Excel</button>
    <button id="preview" class="ghost" title="Ver las filas del Excel antes de descargarlo">Vista previa</button>
    <button id="clear" class="ghost">Limpiar</button>
  </div>
  <form id="exportForm" hidden>
    <label class="field-label" for="exportName">Nombre del archivo Excel</label>
    <input id="exportName" class="text-input" autocomplete="off" placeholder="Ej: Audifonos_Hyperx">
    <div class="hint" id="exportNamePreview"></div>
    <div class="row">
      <button type="submit" class="secondary">Descargar</button>
      <button type="button" id="cancelExport" class="ghost">Cancelar</button>
    </div>
  </form>
</div>

<footer><span id="configInfo"></span><a href="#" id="openOptions">Opciones</a></footer>
<script type="module" src="popup.js"></script>
</body>
</html>
