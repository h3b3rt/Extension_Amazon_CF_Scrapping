<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amazon Scraper</title>
<style>
body{width:340px;margin:0;padding:18px;box-sizing:border-box;font-family:Arial,sans-serif;background:#f7f8fa;color:#111827}
h1{font-size:18px;margin:0 0 4px}
.subtitle{font-size:12px;color:#6b7280;margin-bottom:14px}
button{width:100%;border:0;border-radius:8px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;background:#ff9900;color:#111}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:not-allowed}
button.secondary{background:#232f3e;color:#fff;padding:10px}
button.ghost{background:#e5e7eb;color:#111;padding:10px;width:auto;flex:0 0 auto}
.check{display:flex;gap:8px;align-items:flex-start;font-size:12px;margin-bottom:8px;cursor:pointer;line-height:1.35}
.check input{margin:1px 0 0}
#status{margin-top:12px;padding:11px;background:#fff;border-radius:7px;font-size:12px;line-height:1.55;white-space:pre-line}
.success{color:#15803d}
.error{color:#b91c1c}
.banner{background:#fff7e6;border:1px solid #fcd34d;border-radius:7px;padding:9px 11px;font-size:12px;line-height:1.45;margin-bottom:12px}
.banner a{color:#b45309;font-weight:700}
.banner p{margin:0}
.banner p+p{margin-top:6px}
#collection{margin-top:12px;padding:11px;background:#fff;border-radius:7px}
.count{font-size:13px;margin-bottom:9px}
.row{display:flex;gap:8px}
.sources{list-style:none;margin:0 0 10px;padding:0;max-height:150px;overflow-y:auto;border-top:1px solid #f0f1f3}
.sources li{font-size:12px;padding:6px 0;border-bottom:1px solid #f0f1f3;line-height:1.4}
.sources a{color:#b45309;font-weight:700;text-decoration:none}
.sources a:hover{text-decoration:underline}
.sources .meta{color:#6b7280}
.panel{background:#fff;border-radius:7px;padding:12px}
.field-label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
.text-input{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #d1d5db;border-radius:7px;font-size:13px}
.text-input:focus{outline:2px solid #ff9900;border-color:#ff9900}
.text-input:disabled{background:#f3f4f6;color:#9ca3af}
.hint{font-size:11px;color:#6b7280;margin:5px 0 10px;word-break:break-all}
.panel .check{margin:8px 0 10px}
#exportForm{margin-top:10px}
#duplicatePanel{background:#fff7e6;border:1px solid #fcd34d;border-radius:7px;padding:12px;margin-bottom:10px}
#duplicatePanel p{margin:0 0 10px;font-size:12px;line-height:1.5;white-space:pre-line}
#duplicatePanel .title{font-weight:700;font-size:13px;margin-bottom:6px}
#replaceData{padding:10px;font-size:13px}
footer{margin-top:14px;font-size:11px;color:#6b7280;display:flex;justify-content:space-between}
footer a{color:#6b7280}
</style>
</head>
<body>
<h1>Amazon Product Scraper</h1>
<div class="subtitle">Exportador CSV de productos · v<span id="version"></span></div>

<div id="update" class="banner" hidden></div>

<button id="scrape">Extraer productos</button>

<div id="duplicatePanel" hidden>
  <p class="title">⚠ Esta página ya fue extraída</p>
  <p id="duplicateInfo"></p>
  <div class="row">
    <button id="replaceData">Reemplazar datos anteriores</button>
    <button id="cancelDuplicate" class="ghost">Cancelar</button>
  </div>
</div>

<form id="categoryForm" class="panel" hidden>
  <label class="field-label" for="category">Categoría principal de estos productos</label>
  <input id="category" class="text-input" list="recentCategories" autocomplete="off" required placeholder="Ej: Audífonos inalámbricos">
  <datalist id="recentCategories"></datalist>
  <label class="check"><input type="checkbox" id="multiCategory"> Múltiples categorías (dejar vacío y completar a mano)</label>
  <div id="fileNameGroup">
    <label class="field-label" for="fileName">Nombre del archivo CSV</label>
    <input id="fileName" class="text-input" autocomplete="off" placeholder="Ej: Audifonos_Hyperx">
    <div class="hint" id="fileNamePreview"></div>
  </div>
  <div class="row">
    <button type="submit">Extraer</button>
    <button type="button" id="cancelCategory" class="ghost">Cancelar</button>
  </div>
</form>

<div id="status" hidden></div>

<div id="collection" hidden>
  <div class="count"><strong id="count">0</strong> productos en la lista</div>
  <ul id="sources" class="sources" hidden></ul>
  <div class="row">
    <button id="download" class="secondary">Descargar CSV</button>
    <button id="clear" class="ghost">Limpiar</button>
  </div>
  <form id="exportForm" hidden>
    <label class="field-label" for="exportName">Nombre del archivo CSV</label>
    <input id="exportName" class="text-input" autocomplete="off" placeholder="Ej: Audifonos_Hyperx">
    <div class="hint" id="exportNamePreview"></div>
    <div class="row">
      <button type="submit" class="secondary">Descargar</button>
      <button type="button" id="cancelExport" class="ghost">Cancelar</button>
    </div>
  </form>
</div>

<footer><span id="configInfo"></span><a href="#" id="openOptions">Opciones</a></footer>
<script type="module" src="popup.js"></script>
</body>
</html>
